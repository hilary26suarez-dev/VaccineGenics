[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaccinegenics"
version = "1.0.0"
description = "AI-powered pharmacogenomics simulation engine for personalized vaccine recommendations"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
azure = [
    "azure-ai-agents>=1.0.0",
    "azure-identity>=1.17.0",
    "azure-ai-projects>=1.0.0b4",
    "azure-search-documents>=11.4.0",
]
viz = [
    "umap-learn>=0.5.0",
    "py3Dmol>=2.0.0",
]
bio = [
    "biopython>=1.83",
    "cyvcf2>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
vaccinegenics = "vaccinegenics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
